# Автоматический деплой игры на GitHub Pages при каждом пуше в main.
# Итоговая ссылка: https://belknikolja-arch.github.io/clicker/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # можно запустить вручную во вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить зависимости
        run: npm run setup

      # base=/clicker/ — игра живёт по адресу ...github.io/clicker/
      - name: Сборка игры
        run: npm run build --prefix client -- --base=/clicker/

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
